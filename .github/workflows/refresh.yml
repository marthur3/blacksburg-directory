name: Refresh directory data

on:
  schedule:
    - cron: "0 9 25 * *"   # monthly, after Overture's usual release window
  workflow_dispatch:
  push:
    branches: [main]
    # Data inputs only. A scripts/** push after merge raced STAC (HTTP 429).
    # Code changes can wait for the monthly run or a manual dispatch.
    paths: ["overrides.csv", "config.json"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb
      - run: python scripts/refresh.py
      - run: python scripts/pages.py
      - name: Commit data
        run: |
          git config user.name "directory-bot"
          git config user.email "directory-bot@users.noreply.github.com"
          git add data/ best/ blacksburg/ christiansburg/ events/ newsletter/ sitemap.xml robots.txt 404.html
          git diff --cached --quiet || git commit -m "Refresh directory data"
          git push
