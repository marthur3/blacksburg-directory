name: Test refresh pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_pipeline.py
      - run: python tests/test_pages.py
      - run: node tests/test_edit_merge.js
      - run: node tests/test_events_tz.js
      - name: Generated pages stay in sync
        run: |
          python scripts/pages.py
          git add -A best blacksburg christiansburg events newsletter sitemap.xml robots.txt 404.html
          git diff --cached --exit-code -- best blacksburg christiansburg events newsletter sitemap.xml robots.txt 404.html
